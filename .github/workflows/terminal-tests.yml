name: Terminal clipboard regression tests

on:
  pull_request:
  push:
    branches: [radix, fix/terminal-copy]

permissions:
  contents: read

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:terminal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terminal-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
