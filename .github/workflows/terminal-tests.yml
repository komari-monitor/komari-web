name: Terminal clipboard regression tests

on:
  pull_request:
  push:
    branches: [radix, fix/terminal-copy]

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:terminal
